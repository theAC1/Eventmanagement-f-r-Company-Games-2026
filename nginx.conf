events {
    worker_connections 1024;
}

http {
    upstream app {
        server app:3000;
    }

    # KEIN globales Rate-Limit mehr.
    #
    # Vorher: limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s,
    # angewendet auf location / — also auf JEDEN Request (Seiten, Bilder,
    # sämtliche API-Aufrufe). Hinter dem Cloudflare-Tunnel sieht nginx aber
    # für ALLE Besucher dieselbe Quell-IP: Das Limit galt damit nicht pro
    # Person, sondern für das ganze Event zusammen. Beim Tooltest am
    # 14.08.2026 blieben ab ca. der fünften Person alle auf der Startseite
    # hängen — überzählige Requests wurden mit 503 abgewiesen, quer über
    # Android, iOS und alle Browser.
    #
    # Brute-Force-Schutz beim Login macht die App selbst (src/lib/rate-limit.ts,
    # pro Benutzername und IP); davor sitzt zusätzlich Cloudflare. Ein
    # nginx-Limit auf dieser Ebene schützt nichts, was sonst offen stünde —
    # es hat nur den Anlass lahmgelegt, für den die Software gebaut ist.
    #
    # Falls hier je wieder ein Limit gesetzt wird: NICHT über
    # $binary_remote_addr schlüsseln, sondern über die echte Client-IP
    # (z.B. $http_cf_connecting_ip), sonst tritt genau dieser Fehler erneut auf.

    # Redirect HTTP → HTTPS (aktivieren wenn SSL eingerichtet)
    # server {
    #     listen 80;
    #     server_name companygames.example.ch;
    #     return 301 https://$server_name$request_uri;
    # }

    server {
        listen 80;
        # listen 443 ssl;  # Aktivieren wenn SSL eingerichtet
        server_name games.arvuna.ch;  # Anpassen: companygames.example.ch

        # SSL (aktivieren wenn Zertifikate vorhanden)
        # ssl_certificate /etc/letsencrypt/live/companygames.example.ch/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/companygames.example.ch/privkey.pem;

        # Gzip
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml;

        # Normale Requests → Next.js
        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket (Socket.io) → Upgrade-fähig
        location /socket.io/ {
            proxy_pass http://app;
            proxy_http_version 1.1;

            # WebSocket Upgrade Headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket Timeouts (länger als normal)
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Next.js Static Files (caching)
        location /_next/static/ {
            proxy_pass http://app;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
