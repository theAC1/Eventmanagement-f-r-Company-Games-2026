name: Deploy to Homelab

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        working-directory: /home/deploy/company-games-2026
        run: git pull origin main

      # Am 13.08.2026 ist ein Deploy nach 13 Minuten mitten im Build-Schritt
      # weggebrochen — der Schritt blieb ohne Abschluss, der Job wurde als
      # failure markiert, im Log stand nichts. Diese drei Zeilen kosten nichts
      # und stehen beim nächsten Mal im Protokoll: volle Platte und knapper
      # Speicher sehen im Build-Log sonst beide gleich aus, nämlich wie ein
      # Hänger.
      - name: Ressourcen vor dem Build
        working-directory: /home/deploy/company-games-2026
        run: |
          df -h /
          free -h
          docker system df

      # Ohne --no-cache: der deps-Layer (npm ci) wird über package.json und
      # package-lock.json gekeyt und nur bei echten Dependency-Änderungen neu
      # gebaut. Alles ab `COPY . .` invalidiert der Code-Stand ohnehin selbst,
      # es kann also nichts Altes überleben. Spart auf dem Homelab-Container
      # Zeit, Speicher und Platz bei jedem Deploy.
      - name: Build containers
        working-directory: /home/deploy/company-games-2026
        run: docker compose build

      - name: Stop app for migration
        working-directory: /home/deploy/company-games-2026
        run: docker compose stop app nginx

      - name: Run schema migration
        working-directory: /home/deploy/company-games-2026
        run: docker compose run --rm app npx prisma db push

      - name: Start all containers
        working-directory: /home/deploy/company-games-2026
        run: docker compose up -d

      - name: Wait for healthy app
        run: |
          echo "Waiting for app to be healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "✅ Deployment OK: $(date)"
              exit 0
            fi
            echo "  Attempt $i/30 - waiting..."
            sleep 2
          done
          echo "❌ Health check failed after 60s"
          exit 1

      # Jeder Deploy lässt den vorherigen Image-Satz als dangling zurück. Ohne
      # Aufräumen wächst die Platte bei jedem Push um die Grösse eines
      # kompletten node_modules-Layers — der Container stand am 13.08.2026 bei
      # 84 %. Läuft auch nach einem Fehlschlag: gerade dann ist Platz
      # zurückgewinnen wichtig.
      - name: Alte Images aufräumen
        if: always()
        working-directory: /home/deploy/company-games-2026
        run: |
          docker image prune -f
          df -h /
